# Target schools: all Departments of Internal Medicine ranked by FY2025 NIH funding
# (BRIMR 2025 ranking, 108 departments, https://brimr.org/brimr-rankings-of-nih-funding-in-2025/), plus added institutions.
#
# Each source tells the tracker which careers system a school uses.
# type: workday | oracle | eightfold | rmk | jibe | mcloud | taleo | html_list | ucrecruit | sitemap | board | icims | phenom | manual
# "manual" sources are not fetched; the dashboard shows a direct link to check by hand.
# Set enabled: false to pause a source without deleting it.

schools:
  - rank: 1
    name: Vanderbilt
    sources:
      - id: vumc
        label: Vanderbilt University Medical Center
        type: workday
        host: vumc.wd1.myworkdayjobs.com
        tenant: vumc
        site: vumccareers
      - id: vanderbilt-univ
        label: Vanderbilt University
        type: oracle
        host: ecsr.fa.us2.oraclecloud.com
        site: CX_1
      - id: vanderbilt-postdoc
        label: Vanderbilt Office of Postdoctoral Affairs board
        type: board
        url: https://www.vanderbilt.edu/postdoc/prospective-postdocs/current-opportunities/
        row: 'tr:has(a[href^="?id="])'
        link: 'a[href^="?id="]'
        date: 'td:nth-of-type(1)'
        dept: 'td:nth-of-type(2)'
        mentor: 'td:nth-of-type(4)'
        title_template: 'Postdoctoral position: {dept} ({mentor})'
        detail: main

