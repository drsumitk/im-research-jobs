<script >
  var videoStarted, videoTen, videoTwentyFive, videoFifty, videoSeventyFive, videoComplete = false;
  function videoEvent(eventName, eventDetails) {
    var videoId = eventDetails.detail.videoId;
    var videoData;

    if (window.altruWidget && window.altruWidget.getCachedData()) {
      var videoWidgetData = window.altruWidget.getCachedData()[0];

      for (var answer of videoWidgetData.answers) {
        if (answer.video_id === videoId) {
          videoData = answer;
        }
      }
    }

    return {
      event: eventName,
      video_title: videoData && videoData.question_text ? videoData.question_text : '', // Video title ex. Describe Our Company Culture, How long have you been with the company
      video_percent:
        eventDetails.detail.percentage && eventDetails.detail.percentage ? eventDetails.detail.percentage + '%' : '', // Video percent viewed (with percent sign) - 10%, 25%, 50%, 75%, 100%
      video_current_time: eventDetails.detail.currentTime ? eventDetails.detail.currentTime : '', // Current timestamp of the video where the view is (in seconds) ex. 05, 10, 30
      video_duration: videoData && videoData.duration ? videoData.duration : '', // Video duration (in seconds) ex. 19, 30
      video_provider: 'Altru Widget', // Provider of the video ex. YouTube, Video Player
      video_url: videoData && videoData.video_url ? videoData.video_url : '', // Video URL ex.
      visible: 1, // Returns '1' if the player is visible on the screen while the video engagement was tracked ex. 0,1
      video_autoplay: 'N', // Video autoplay flag - returns a Y if the video autoplays on page load ex. Y, N     };
      platform_name:'careers',
      host_name: 'tuftscareers',
    };
  }

  window.addEventListener('altru-showvideo', function (event) {
    dataLayer.push(videoEvent('video_start', event));

    var video = document.querySelector('video');

    video.addEventListener('timeupdate', function (e) {
    var percentageCompleted = (e.target.currentTime)/(e.target.duration)*100;
    var intPercentageCompleted=parseInt(percentageCompleted);
    if( !(intPercentageCompleted>=0 && intPercentageCompleted<=100)){
      return;
    }


    if ((!videoTen) && (percentageCompleted > 10)) {
        videoTen = true;
      // trigger GA4 10 percent      
      event.detail.percentage=10;
      event.detail.currentTime=e.target.currentTime;
      dataLayer.push(videoEvent('video_progress', event));
    }


    if ((!videoTwentyFive) && (percentageCompleted > 25)) {
        videoTwentyFive = true;
        // trigger GA4 25 percent      
        event.detail.percentage=25;
        event.detail.currentTime=e.target.currentTime;
        dataLayer.push(videoEvent('video_progress', event));
    }


    if ((!videoFifty) && (percentageCompleted > 50)) {
        videoFifty = true;
    // trigger GA4 50 percent  
    event.detail.percentage=50;
    event.detail.currentTime=e.target.currentTime;
    dataLayer.push(videoEvent('video_progress', event));    
    }
    
    
    if ((!videoSeventyFive) && (percentageCompleted > 75)) {
        videoSeventyFive = true;
        // trigger GA4 75 percent      
        event.detail.percentage=75;
        event.detail.currentTime=e.target.currentTime;
        dataLayer.push(videoEvent('video_progress', event));
    }
    

    if ((!videoComplete) && (percentageCompleted > 99)) {
        videoComplete = true;
        // trigger GA4 100 percent  
        event.detail.percentage=100;
        event.detail.currentTime=e.target.currentTime;
        dataLayer.push(videoEvent('video_progress', event));   
    }

    
  });
  });

  window.addEventListener('altru-video-stopped', function (e) {
    dataLayer.push(videoEvent('video_pause', e));
  });

</script>

<script >
   function searchEvent(search) {
   var searchQuery= window._jibe.models && window._jibe.models.jobs &&
                    window._jibe.models.jobs.paramsImpression &&
                    window._jibe.models.jobs.paramsImpression.paramsData;
   var remoteEligible="";
   if(searchQuery && searchQuery.locationType)
   {
        let remoteArr= searchQuery.locationType.split('|');
        
        for(let iter in remoteArr){
            if(remoteArr[iter]==="LAT_LNG"){
                remoteArr[iter]="No";
            }
            else if(remoteArr[iter]==="ANY"){
                remoteArr[iter]="Yes";
            }
            else{
                remoteArr[iter]="";
            }
        }
        remoteEligible= remoteArr.toString();
   }     

   if(searchQuery && searchQuery.tags5)
   {
        let remoteArr= searchQuery && searchQuery.tags5.split('|');
        remoteEligible= remoteArr.toString();
    }            
                    return {
                        'event': search,
                        'search_filter_term': searchQuery.keywords? searchQuery.keywords: '',
                        'search_filter_city': searchQuery.location? searchQuery.location: '',
                        'search_filter_state': '',
                        'search_filter_country': searchQuery.country? searchQuery.country: '',
                        'search_filter_zip': '',
                        'stretch_units': searchQuery.stretchUnit? searchQuery.stretchUnit: '',
                        'commute_filter_location': searchQuery.location? searchQuery.location: '',

                        'search_filter_location_radius': searchQuery.stretch? searchQuery.stretch: '',
                        'search_filter_category': searchQuery.categories? searchQuery.categories.split('|').toString(): '',
                        'search_filter_position_type': searchQuery.tags? searchQuery.tags: '',
                        'search_filter_remote_role': remoteEligible,
                        'platform_name':'careers',
                        'host_name': 'tuftscareers',
                    };

agreed that we will make use of all personal information, applications, attachments and draft applications for recruitment purposes only and will not make this information available to any third party unconnected with our recruitment processes.</p>\n\n<p>Your registration and access to our Careers Web Site indicates your acceptance of these Terms and Agreements.</p>","DECLINE-MSG":"You cannot proceed without accepting the Privacy Policy.","BUTTON-2":"Disagree","BUTTON-1":"Agree"}},"JOBS_FILTER_TYPE":"Employment Type","GDPR":{"COOKIE_CONSENT_CLOSE_ICON":"Close","APPLY_CONSENT_BODY":"<p>This career site protects your privacy by adhering to the European Union General Data Protection Regulation (GDPR). We will not use your data for any purpose to which you do not consent.</p>\n\n<p>We store anonymized interaction data in an aggregated form about visitors and their experiences on our site using cookies and tracking mechanisms.  We use this data to fix site defects and improve the general user experience.</p>\n\n<p>We request use of your data for the following purposes:</p>\n\n<p>Job Application Data</p>\n<p>This site may collect sensitive personal information as a necessary part of a job application. The data is collected to support one or more job applications, or to match you to future job opportunities. This data is stored and retained for a default period of 12 months to support job matching or improve the user experience for additional job applications. The data for each application is transferred to the Applicant Tracking System in order to move the application through the hiring process.<br />\nYou have the right to view, update, delete, export, or restrict further processing of your job application data. To exercise these rights, you can e-mail us at <a href=\"mailto:privacy@icims.com\">privacy@icims.com</a>.<br />\nConversion Tracking<br />\nWe store anonymized data on redirects to the career site that is used to measure the effectiveness of other vendors in sourcing job candidates.</p>\n\nLearn more about your career site data on our <a href=\"https://www.icims.com/legal/privacy-notice-website/\">Privacy Policy</a> page.</p>","APPLY_CONSENT_TEXT":"<h3>Consent and Data Privacy</h3>","COOKIE_CONSENT_BUTTON_DENY":"Decline","APPLY_CONSENT_DECLINE":"Decline","CLOSE":"x","APPLY_CONSENT_ACCEPT":"Accept","PIXEL_TRACKING_CONSENT_TEXT":"Do you want a Cookie?","THIRDPARTY_CONSENT_BUTTON_DENY":"Decline","THIRDPARTY_TRACKING_CONSENT_TEXT":"Anonymized data is stored for redirects to the career site tracking successful searches leading to job applications in effort to measure effectiveness of partners in sourcing job candidates and job searches. We request use of anonymized data to improve your experience on our site.","COOKIE_CONSENT_BUTTON_ACCEPT":"Okay","THIRDPARTY_CONSENT_BUTTON_ACCEPT":"Accept","CONSENT_BUTTON":"Accept","COOKIE_TRACKING_CONSENT_TEXT":"Cookies are used on this site to assist in continually improving the candidate experience and all the interaction data we store of our visitors is anonymous. Learn more about your rights on our <a href=\"https://www.tufts.edu/about/privacy\"\" target=\"_blank\">Privacy Policy</a> page."},"CRM":{"ISHIRED_FILTER_YES":"Yes","ISHIRED_FILTER_LABEL":"Current Employee","VIP_NAME":"VIP","SEARCH":{"TITLE":"Search"},"GROUP_LABEL":"Group","CANDIDATE_DETAIL":{"REFERRALS_DETAIL":{"SUBHEADER":{"REFERRER":"Referrer"}},"MAIN":{"INVITE_TO_JOIN_HEADER":"Invite to Join Nurture"},"HEADER":{"REFERRALS_TAB":"Referrals"},"BACKGROUND":{"PROFILE":{"MAIN_SECTION_BASIC_INFO_INELIGIBLE_LABEL":"Marked Ineligible Until","CONTACT_UNSUBSCRIBED":"Unsubscribed","CONTACT_SUBSCRIBED":"Subscribed"},"ACTIVITY":{"HIRING_STATUS_DATETIME":"Date/Time"}}},"SETTINGS":{"RECRUITER_MANAGEMENT":{"FORM_INPUT_ATSID_HELPER_TEXT":"This is located in Recruit on the top left the User Profile.  It's also located on the Person Reporting page under \"Reporting & Advanced Options - General\" as \"System ID\".","FORM_INPUT_ATSID_PLACEHOLDER": ically agreed that we will make use of all personal information, applications, attachments and draft applications for recruitment purposes only and will not make this information available to any third party unconnected with our recruitment processes.</p>\n\n<p>Your registration and access to our Careers Web Site indicates your acceptance of these Terms and Agreements.</p>","DECLINE-MSG":"You cannot proceed without accepting the Privacy Policy.","BUTTON-2":"Disagree","BUTTON-1":"Agree"}},"JOBS_FILTER_TYPE":"Employment Type","GDPR":{"COOKIE_CONSENT_CLOSE_ICON":"Close","APPLY_CONSENT_BODY":"<p>This career site protects your privacy by adhering to the European Union General Data Protection Regulation (GDPR). We will not use your data for any purpose to which you do not consent.</p>\n\n<p>We store anonymized interaction data in an aggregated form about visitors and their experiences on our site using cookies and tracking mechanisms.  We use this data to fix site defects and improve the general user experience.</p>\n\n<p>We request use of your data for the following purposes:</p>\n\n<p>Job Application Data</p>\n<p>This site may collect sensitive personal information as a necessary part of a job application. The data is collected to support one or more job applications, or to match you to future job opportunities. This data is stored and retained for a default period of 12 months to support job matching or improve the user experience for additional job applications. The data for each application is transferred to the Applicant Tracking System in order to move the application through the hiring process.<br />\nYou have the right to view, update, delete, export, or restrict further processing of your job application data. To exercise these rights, you can e-mail us at <a href=\"mailto:privacy@icims.com\">privacy@icims.com</a>.<br />\nConversion Tracking<br />\nWe store anonymized data on redirects to the career site that is used to measure the effectiveness of other vendors in sourcing job candidates.</p>\n\nLearn more about your career site data on our <a href=\"https://www.icims.com/legal/privacy-notice-website/\">Privacy Policy</a> page.</p>","APPLY_CONSENT_TEXT":"<h3>Consent and Data Privacy</h3>","COOKIE_CONSENT_BUTTON_DENY":"Decline","APPLY_CONSENT_DECLINE":"Decline","CLOSE":"x","APPLY_CONSENT_ACCEPT":"Accept","PIXEL_TRACKING_CONSENT_TEXT":"Do you want a Cookie?","THIRDPARTY_CONSENT_BUTTON_DENY":"Decline","THIRDPARTY_TRACKING_CONSENT_TEXT":"Anonymized data is stored for redirects to the career site tracking successful searches leading to job applications in effort to measure effectiveness of partners in sourcing job candidates and job searches. We request use of anonymized data to improve your experience on our site.","COOKIE_CONSENT_BUTTON_ACCEPT":"Okay","THIRDPARTY_CONSENT_BUTTON_ACCEPT":"Accept","CONSENT_BUTTON":"Accept","COOKIE_TRACKING_CONSENT_TEXT":"Cookies are used on this site to assist in continually improving the candidate experience and all the interaction data we store of our visitors is anonymous. Learn more about your rights on our <a href=\"https://www.tufts.edu/about/privacy\"\" target=\"_blank\">Privacy Policy</a> page."},"CRM":{"ISHIRED_FILTER_YES":"Yes","ISHIRED_FILTER_LABEL":"Current Employee","VIP_NAME":"VIP","SEARCH":{"TITLE":"Search"},"GROUP_LABEL":"Group","CANDIDATE_DETAIL":{"REFERRALS_DETAIL":{"SUBHEADER":{"REFERRER":"Referrer"}},"MAIN":{"INVITE_TO_JOIN_HEADER":"Invite to Join Nurture"},"HEADER":{"REFERRALS_TAB":"Referrals"},"BACKGROUND":{"PROFILE":{"MAIN_SECTION_BASIC_INFO_INELIGIBLE_LABEL":"Marked Ineligible Until","CONTACT_UNSUBSCRIBED":"Unsubscribed","CONTACT_SUBSCRIBED":"Subscribed"},"ACTIVITY":{"HIRING_STATUS_DATETIME":"Date/Time"}}},"SETTINGS":{"RECRUITER_MANAGEMENT":{"FORM_INPUT_ATSID_HELPER_TEXT":"This is located in Recruit on the top left the User Profile.  It's also located on the Person Reporting page under \"Reporting & Advanced Options - General\" as \"System ID\".","FORM_INPUT_ATSID_PLACEH t is specifically agreed that we will make use of all personal information, applications, attachments and draft applications for recruitment purposes only and will not make this information available to any third party unconnected with our recruitment processes.</p>\n\n<p>Your registration and access to our Careers Web Site indicates your acceptance of these Terms and Agreements.</p>","DECLINE-MSG":"You cannot proceed without accepting the Privacy Policy.","BUTTON-2":"Disagree","BUTTON-1":"Agree"}},"JOBS_FILTER_TYPE":"Employment Type","GDPR":{"COOKIE_CONSENT_CLOSE_ICON":"Close","APPLY_CONSENT_BODY":"<p>This career site protects your privacy by adhering to the European Union General Data Protection Regulation (GDPR). We will not use your data for any purpose to which you do not consent.</p>\n\n<p>We store anonymized interaction data in an aggregated form about visitors and their experiences on our site using cookies and tracking mechanisms.  We use this data to fix site defects and improve the general user experience.</p>\n\n<p>We request use of your data for the following purposes:</p>\n\n<p>Job Application Data</p>\n<p>This site may collect sensitive personal information as a necessary part of a job application. The data is collected to support one or more job applications, or to match you to future job opportunities. This data is stored and retained for a default period of 12 months to support job matching or improve the user experience for additional job applications. The data for each application is transferred to the Applicant Tracking System in order to move the application through the hiring process.<br />\nYou have the right to view, update, delete, export, or restrict further processing of your job application data. To exercise these rights, you can e-mail us at <a href=\"mailto:privacy@icims.com\">privacy@icims.com</a>.<br />\nConversion Tracking<br />\nWe store anonymized data on redirects to the career site that is used to measure the effectiveness of other vendors in sourcing job candidates.</p>\n\nLearn more about your career site data on our <a href=\"https://www.icims.com/legal/privacy-notice-website/\">Privacy Policy</a> page.</p>","APPLY_CONSENT_TEXT":"<h3>Consent and Data Privacy</h3>","COOKIE_CONSENT_BUTTON_DENY":"Decline","APPLY_CONSENT_DECLINE":"Decline","CLOSE":"x","APPLY_CONSENT_ACCEPT":"Accept","PIXEL_TRACKING_CONSENT_TEXT":"Do you want a Cookie?","THIRDPARTY_CONSENT_BUTTON_DENY":"Decline","THIRDPARTY_TRACKING_CONSENT_TEXT":"Anonymized data is stored for redirects to the career site tracking successful searches leading to job applications in effort to measure effectiveness of partners in sourcing job candidates and job searches. We request use of anonymized data to improve your experience on our site.","COOKIE_CONSENT_BUTTON_ACCEPT":"Okay","THIRDPARTY_CONSENT_BUTTON_ACCEPT":"Accept","CONSENT_BUTTON":"Accept","COOKIE_TRACKING_CONSENT_TEXT":"Cookies are used on this site to assist in continually improving the candidate experience and all the interaction data we store of our visitors is anonymous. Learn more about your rights on our <a href=\"https://www.tufts.edu/about/privacy\"\" target=\"_blank\">Privacy Policy</a> page."},"CRM":{"ISHIRED_FILTER_YES":"Yes","ISHIRED_FILTER_LABEL":"Current Employee","VIP_NAME":"VIP","SEARCH":{"TITLE":"Search"},"GROUP_LABEL":"Group","CANDIDATE_DETAIL":{"REFERRALS_DETAIL":{"SUBHEADER":{"REFERRER":"Referrer"}},"MAIN":{"INVITE_TO_JOIN_HEADER":"Invite to Join Nurture"},"HEADER":{"REFERRALS_TAB":"Referrals"},"BACKGROUND":{"PROFILE":{"MAIN_SECTION_BASIC_INFO_INELIGIBLE_LABEL":"Marked Ineligible Until","CONTACT_UNSUBSCRIBED":"Unsubscribed","CONTACT_SUBSCRIBED":"Subscribed"},"ACTIVITY":{"HIRING_STATUS_DATETIME":"Date/Time"}}},"SETTINGS":{"RECRUITER_MANAGEMENT":{"FORM_INPUT_ATSID_HELPER_TEXT":"This is located in Recruit on the top left the User Profile.  It's also located on the Person Reporting page under \"Reporting & Advanced Options - General\" as \"System ID\".","FORM_INPUT_A
